      }
      node.svgs.forEach(svg => {
        const inactiveTheme = settled && (toon ? !!svg.closest('.ringsvg') : !!svg.closest('.toonwrap'))
        const stop = paused || inactiveTheme || reduce
        const wasPaused = node.smilPaused.has(svg)
        if (stop === wasPaused || !svg.pauseAnimations) return
        if (stop) { node.smilPaused.set(svg, performance.now()); svg.pauseAnimations() }
        else {
          // Invisible animations catch up before reappearing, without rendering hidden frames.
          svg.setCurrentTime(svg.getCurrentTime() + (performance.now() - node.smilPaused.get(svg)) / 1000)
          node.smilPaused.delete(svg)
          svg.unpauseAnimations()
        }
      })
    })
  }
  function syncSuspension() {
    const next = pageHidden || document.hidden || $('overview').classList.contains('open')
    if (next !== suspended) {
      suspended = next
      stage.classList.toggle('render-suspended', suspended)
      if (suspended) { sceneSnap?.cancel(); cancelAnimationFrame(frameId); frameId = 0 }
      else {
        requestFrame()
        sceneSnap?.resume()
      }
    }
    syncRendering()
  }
  addEventListener('visibilitychange', syncSuspension)
  addEventListener('pagehide', () => { pageHidden = true; syncSuspension() })
  addEventListener('pageshow', () => { pageHidden = false; syncSuspension() })
  function frame(t) {
    frameId = 0
    if (suspended) return
    ticking = true
    const dt = previousFrame === null ? 1000 / 60 : Math.min(50, t - previousFrame)
    previousFrame = t
    // An elapsed-time clock avoids a scroll jump when waking from an idle scene.
    scrollClock += dt
    lenis?.raf(scrollClock)
    if (measurePending) { measurePending = false; measure() }
    if (introStart === null) introStart = t
    const smoothing = 1 - Math.pow(0.95, dt / (1000 / 60))
    cx = Math.abs(mxp - cx) < 0.00001 ? mxp : cx + (mxp - cx) * smoothing
    cy = Math.abs(myp - cy) < 0.00001 ? myp : cy + (myp - cy) * smoothing
    const p = progress(), u = p * U

    writeStyle(auroraEl, 'transform', `translate3d(${cx * -24}px, ${cy * -16 - p * 80}px, 0) scale(${1 + p * 0.25})`)
    writeStyle(farEl, 'transform', `translate3d(${cx * -38}px, ${cy * -26}px, 0) scale(${1 + p * 0.6})`)
    // Arrival warp: stars rush toward you for the first ~1.2s, then ease to a stop.
    const ia = reduce ? 1 : Math.min(1, (t - introStart) / 1200), warpBoost = (1 - Math.pow(1 - ia, 3)) * 3.2
    const travel = reduce ? 0 : u * 1.3 + warpBoost
    if (!stage.classList.contains('warping')) writeStyle(streaksEl, 'opacity', reduce ? '0' : ((1 - ia) * .55).toFixed(3))
    else writeStyle(streaksEl, 'opacity', '')
    warps.forEach((w, i) => { const f = (travel + i / warps.length) % 1
      writeStyle(w, 'transform', `translate3d(${cx * -60}px, ${cy * -40}px, 0) scale(${0.6 + f * f * 3.4})`); writeStyle(w, 'opacity', String(Math.sin(Math.PI * f) * 0.9)) })

    if (u !== lastSceneU || layoutVersion !== lastLayoutVersion) {
      sceneNodes.forEach((node, i) => {
        const { scene, floats } = node
        const distance = Math.abs(u - SCENES[i].u)
        if (distance > 1.2) {
          if (!node.hidden) {
            writeStyle(scene, 'opacity', '0')
            if (scene.style.visibility !== 'hidden') scene.style.visibility = 'hidden'
            if (scene.classList.contains('active')) scene.classList.remove('active')
            node.hidden = true
          }
          return
        }
        node.hidden = false
        let z = u - SCENES[i].u                          // route units: <0 ahead, >0 passed
        if (i === 0 && z < 0) z = 0; if (i === SCENES.length - 1 && z > 0) z = 0
        const approach = z < 0 ? range(-z, 0.12, 0.8) : 0, pass = z > 0 ? range(z, 0.12, 0.8) : 0
        const opacity = (1 - approach) * (1 - pass)
        writeStyle(scene, 'opacity', String(opacity))
        writeStyle(scene, 'transform', `scale(${1 - approach * 0.55 + pass * 0.9})`)
        writeStyle(scene, 'filter', opacity > 0.98 ? 'none' : `blur(${(approach * 10 + pass * 14).toFixed(1)}px)`)
        const active = opacity > 0.6
        if (scene.classList.contains('active') !== active) scene.classList.toggle('active', active)
        const visible = opacity >= 0.01
        if ((scene.style.visibility !== 'hidden') !== visible) scene.style.visibility = visible ? 'visible' : 'hidden'
        floats.forEach(({ el, depth }) => {
          const a = z < 0 ? range(-z + depth, 0.12, 0.8) : 0
          writeStyle(el, 'translate', `0 ${a * 40}px`)
          writeStyle(el, 'opacity', String(1 - a))
        })
      })
      lastSceneU = u
      lastLayoutVersion = layoutVersion
      syncRendering()
    }

    // HUD changes only with the route position.
    if (u !== lastHudU) {
      lastHudU = u
      const idx = readout(u)
      const shipX = String(ux(u))
      if (shipEl.getAttribute('cx') !== shipX) shipEl.setAttribute('cx', shipX)
      if (doneEl.getAttribute('x2') !== shipX) doneEl.setAttribute('x2', shipX)
      if (idx !== lastIdx) {
        lastIdx = idx
        mapDots.forEach((d, j) => {
          const stroke = j === idx ? '#fff' : 'none'
          if (d.getAttribute('stroke') !== stroke) d.setAttribute('stroke', stroke)
          if (d.getAttribute('stroke-width') !== '1.5') d.setAttribute('stroke-width', '1.5')
        })
      }
    }

    // Hero cards fly past the camera as you leave the first scene.
    const out = range(u, 0, 0.8)
    if (SCENES[0].el.style.visibility !== 'hidden') {
      cards.forEach((card, i) => {
        const c = card.el
        if (c === heldCard && out < 0.05) return   // hovered: hold still so the hover doesn't flicker
        const d = card.depth, bob = Math.sin(t / 1000 * 0.6 + i * 1.7) * 8 * (1 - out), tilt = Math.sin(t / 1000 * 0.4 + i) * 1.2
        const { dx, dy } = card, k = out * (1.4 + d)
        // Arrival: each card starts deep in space near the centre — tiny, blurred, dim — and drifts out to its place.
        const a = reduce ? 1 : ease(Math.min(1, Math.max(0, (t - introStart - 250 - i * 180) / 1700)))
        const far = 1 - a, spin = far * (i % 2 ? 14 : -14)
        const ry = (dx < 0 ? 1 : -1) * 4, rxx = (dy < 0 ? -1 : 1) * 2   // a hint of depth, not a lot
        writeStyle(c, 'transform', `perspective(900px) translate3d(${cx * 60 * d * a + dx * k - dx * far * .82}px, ${cy * 40 * d * a + bob + dy * k - dy * far * .82}px, 0) scale(${(1 + k * 1.3) * (0.16 + 0.84 * a)}) rotateY(${ry + cx * 3}deg) rotateX(${rxx - cy * 2}deg) rotate(${tilt + cx * 3 * d + spin}deg)`)
        writeStyle(c, 'opacity', a < 1 ? String(Math.min(1, a * 1.6)) : '')
        writeStyle(c, 'filter', a < 1 ? `blur(${(far * 10).toFixed(1)}px) brightness(${(0.5 + 0.5 * a).toFixed(2)})` : '')
      })
    }

    // Planets turn, moons orbit (only while visible).
    const themeSettled = document.documentElement.classList.contains('theme-toon') && document.documentElement.classList.contains('settled')
    systems.forEach(o => {
      if (o.s.el.style.visibility === 'hidden') return
      if (!themeSettled) {
        const W2 = o.textureWidth, sp = (t / 1000 * o.pl.spin) % W2
        writeStyle(o.surf, 'backgroundPositionX', `${-sp}px`)
        if (o.lit) writeStyle(o.lit, 'backgroundPositionX', `${-sp}px`)
        writeStyle(o.cloud, 'backgroundPositionX', `${-(t / 1000 * o.pl.spin * 1.45) % W2}px`)
      }
      const R = o.radius
      o.moons.forEach(m => {
        // A hovered moon stops in place (its clock pauses) so the preview stays put.
        const hov = m.hovered; m.clock = (m.clock ?? 0) + (hov || reduce ? 0 : Math.min(50, t - (m.last ?? t))); m.last = t
        const a = m.clock / 1000 * m.sp + m.phase, x = Math.cos(a) * R * m.rf, y = Math.sin(a) * R * m.rf * m.ry, front = Math.sin(a) > -0.15
        const tilt = m.tilt * Math.PI / 180, rx = x * Math.cos(tilt) - y * Math.sin(tilt), ry = x * Math.sin(tilt) + y * Math.cos(tilt)
        m.el.classList.toggle('left', rx < 0)   // labels point outward, away from the planet
        m.el.classList.toggle('behind', !front && Math.hypot(rx, ry) < R * 0.78)
        const ox = m.el.classList.contains('left') ? m.leftOrigin : 11   // keep the moon dot on its orbit when the label flips
        writeStyle(m.el, 'transformOrigin', `${ox}px 11px`)
        writeStyle(m.el, 'transform', `translate(${rx - ox}px, ${ry - 11}px) scale(${0.82 + 0.22 * (Math.sin(a) + 1) / 2})`)
        const hovered = m.hovered
        writeStyle(m.el, 'zIndex', hovered ? '7' : front ? '4' : '1')
        writeStyle(m.el, 'opacity', front || hovered ? '1' : '0.55')
      })
    })

    if (hatsScene.el.style.visibility !== 'hidden') drawHats(t)
    if (lifeScene.el.style.visibility !== 'hidden') drawHobbies(t)
    ticking = false
    const activeMotion = SCENES[0].el.style.visibility !== 'hidden' ||
      hatsScene.el.style.visibility !== 'hidden' || lifeScene.el.style.visibility !== 'hidden' ||
      systems.some(o => o.s.el.style.visibility !== 'hidden')
    const pointerMoving = cx !== mxp || cy !== myp
    if (activeMotion || pointerMoving || ia < 1 || lenis?.isScrolling || measurePending) frameId = requestAnimationFrame(frame)
  }
  requestFrame()
  // Release the arrival once the first frames are painted (skip it when coming back from a case study).
  if (params.has('from')) document.body.classList.remove('arriving')
  else setTimeout(() => document.body.classList.remove('arriving'), 700)

  // Auto-cycle hats while that scene is in focus.
  setInterval(() => { if (!suspended && !reduce && hatsScene.el.classList.contains('active') && !modal.classList.contains('open')) setHat((hatIdx + 1) % HATS.length) }, 3400)

  // =====================================================================================
  // Navigation: smooth scroll, warp jumps, keyboard
  // =====================================================================================
  const yFor = i => (SCENES[i].u / U) * (LC.journeyHeight - LC.innerHeight)
  if (!reduce) {
    lenis = new Lenis({ lerp: 0.12, smoothWheel: true, wheelMultiplier: 1, syncTouch: false })
    lenis.on('scroll', requestFrame)
  }
  sceneSnap = createSceneSnap({
    getStops: () => SCENES.map((_, i) => yFor(i)),
    getPosition: () => scrollY,
    enabled: () => pinned === null && !suspended && !document.hidden && !navigatingAway &&
      !modal.classList.contains('open') && !camera.classList.contains('diving'),
    isMoving: () => !!lenis && lenis.isScrolling === 'smooth' && Math.abs(lenis.velocity) > .25,
    ignoreInput: event => !!event.target.closest?.('.modal, .overview, input, textarea, select, [contenteditable="true"], [data-lenis-prevent]'),
    stopAnimation: () => {
      stage.classList.remove('warping')
      if (lenis) lenis.scrollTo(scrollY, { immediate: true, force: true })
      else scrollTo({ top: scrollY, behavior: 'instant' })
      requestFrame()
    },
    animateTo: (target, { kind, duration, onComplete }) => {
      requestFrame()
      const dist = Math.abs(target - scrollY) / LC.innerHeight
      if (kind === 'navigate' && dist > 2 && !reduce) stage.classList.add('warping')
      const complete = () => { stage.classList.remove('warping'); onComplete() }
      if (!lenis || reduce || duration === 0) {
        if (lenis) lenis.scrollTo(target, { immediate: true, force: true })
        else scrollTo({ top: target, behavior: 'instant' })
        complete()
      } else lenis.scrollTo(target, {
        duration: kind === 'navigate' ? Math.min(1.8, .55 + dist * .12) : duration,
        easing: x => 1 - Math.pow(1 - x, 3),
        onComplete: complete,
      })
    },
  })
  function warpTo(i) {
    if (i >= 0 && i < SCENES.length) sceneSnap.navigate(i)
  }
  const indexOf = key => SCENES.findIndex(s => s.key === key)
  document.querySelectorAll('.proof').forEach(c => { c.removeAttribute('data-go'); c.addEventListener('click', e => e.preventDefault()) })
  document.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); closeOverview(); warpTo(indexOf(a.dataset.go)) }))
  addEventListener('keydown', e => {
    if (e.key === 'Escape') { leave(); closeOverview(); return }
    if (modal.classList.contains('open') || $('overview').classList.contains('open')) return
    if (e.target.closest('a, button, input, textarea, select, [contenteditable="true"], [role="button"]')) return
    const here = sceneSnap.state().targetIndex ?? nearest(progress() * U)
    if (['ArrowDown', 'ArrowRight', 'PageDown'].includes(e.key) || (e.key === ' ' && !e.shiftKey)) { e.preventDefault(); warpTo(here + 1) }
    if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key) || (e.key === ' ' && e.shiftKey)) { e.preventDefault(); warpTo(here - 1) }
    if (e.key === 'Home') { e.preventDefault(); warpTo(0) } if (e.key === 'End') { e.preventDefault(); warpTo(SCENES.length - 1) }
  })

  // =====================================================================================
  // Skip the flight: the short version
  // =====================================================================================
  const OW = 1000, OY = 70, oxy = y => 40 + (y - 2017) / (NOW - 2017) * (OW - 80)
  $('ov').innerHTML = `<h2>The short version</h2><p>Ten years, five teams, newest first. Every result below is also a moon on the flight.</p>
    <div class="map"><svg viewBox="0 0 ${OW} 120" preserveAspectRatio="xMidYMid meet">
      <line x1="40" y1="${OY}" x2="${OW - 40}" y2="${OY}" stroke="rgba(255,255,255,.2)" stroke-dasharray="3 5"/>
      ${[2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026].map(y => `<text class="yr" x="${oxy(y)}" y="${OY + 34}" text-anchor="middle">${y}</text>`).join('')}
      ${PLANETS.map(p => `<line x1="${oxy(p.start)}" y1="${OY}" x2="${oxy(p.end)}" y2="${OY}" stroke="${p.glow}" stroke-width="3" stroke-linecap="round" opacity=".7"/>
        <circle cx="${oxy(p.start)}" cy="${OY}" r="${4 + sizeFor(p) * 10}" fill="${p.glow}"/><text x="${oxy(p.start)}" y="${OY - 22 - sizeFor(p) * 8}" text-anchor="middle">${p.name}</text>`).join('')}
    </svg></div>
    <div class="rows">${PLANETS.map(p => `<div class="row"><div><h3><span class="dot" style="background:${p.glow}"></span>${p.name}</h3><p class="rr">${p.role}</p><p class="yy">${p.years}</p></div>
      <ul>${p.moons.map(m => `<li><b>${m.t}</b> · ${m.stat || m.s}${m.href ? `<a href="${m.href}">Case study →</a>` : ''}</li>`).join('')}</ul></div>`).join('')}</div>
    <p style="margin-top:22px;color:var(--muted)">Also: ${STOPS.slice(2).map(s => s.name).join(', ')}.</p>
    <div class="end"><a class="primary" href="mailto:kunalsatpal1@gmail.com">kunalsatpal1@gmail.com</a><a href="https://kunalsatpal.com/kunalsatpal_resume.pdf">Resume</a><a href="https://www.linkedin.com/in/kunalsatpal1/">LinkedIn</a><button id="backToFlight">Back to the flight</button></div>`
  const overview = $('overview')
  function openOverview() { overview.classList.add('open'); overview.setAttribute('aria-hidden', 'false'); lenis?.stop(); document.body.style.overflow = 'hidden'; overview.scrollTop = 0; $('backToFlight').focus({ preventScroll: true }); $('skipBtn').textContent = 'Back to the flight'; syncSuspension() }
  function closeOverview() { if (!overview.classList.contains('open')) return; overview.classList.remove('open'); overview.setAttribute('aria-hidden', 'true'); lenis?.start(); document.body.style.overflow = ''; $('skipBtn').textContent = 'Skip the flight'; syncSuspension() }
  $('skipBtn').addEventListener('click', () => overview.classList.contains('open') ? closeOverview() : openOverview())
  $('backToFlight').addEventListener('click', closeOverview)
  if (params.has('overview')) openOverview()

  // ---------- Real ↔ Toon: same scene, other universe ----------
  const tgl = $('styleToggle')
  let settleTimer = 0
  const syncThemeToggle = () => tgl.setAttribute('aria-pressed', String(document.documentElement.classList.contains('theme-toon')))
  syncThemeToggle()
  tgl.addEventListener('click', () => {
    clearTimeout(settleTimer)
    document.documentElement.classList.remove('settled')
    const isToon = document.documentElement.classList.toggle('theme-toon')
    localStorage.universeTheme = isToon ? 'toon' : 'real'
    syncThemeToggle()
    syncRendering()
    settleTimer = setTimeout(() => { document.documentElement.classList.add('settled'); syncRendering() }, 850)
  })
  addEventListener('pageshow', e => { if (e.persisted) document.body.classList.remove('swapping') })
  if (params.has('scene')) {
    const i = SCENES.findIndex(s => s.key === params.get('scene'))
    document.body.classList.remove('arriving')
    if (i >= 0) { history.replaceState(null, '', location.pathname); const go = () => { const y = yFor(i); lenis ? lenis.scrollTo(y, { immediate: true, force: true }) : scrollTo(0, y) }; go(); requestAnimationFrame(go) }
    if (!reduce) { document.body.style.opacity = 0; requestAnimationFrame(() => requestAnimationFrame(() => { document.body.style.transition = 'opacity .5s ease'; document.body.style.opacity = '' })) }
  }


  // =====================================================================================
  // Case studies live on moon surfaces (case.html). Going there dives in; coming back zooms out here.
  // =====================================================================================
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href*="case.html"], a[href*="blog.html"]')
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return
    e.preventDefault()
    navigatingAway = true
    sceneSnap.cancel()
    if (reduce) { location.href = a.href; return }
    const r = a.getBoundingClientRect()
    camera.style.transformOrigin = `${r.left + r.width / 2}px ${r.top + r.height / 2}px`
    modal.classList.remove('open'); lenis?.stop()
    camera.style.transition = 'transform .8s cubic-bezier(.6,.05,.25,1), filter .8s'
    camera.style.transform = 'scale(6)'; camera.style.filter = 'blur(14px) brightness(1.6)'
    document.body.style.transition = 'opacity .8s'; setTimeout(() => document.body.style.opacity = 0, 300)
    setTimeout(() => location.href = a.href, 780)
  })
  addEventListener('pageshow', e => { if (e.persisted) { navigatingAway = false; sceneSnap?.resume(); document.body.style.opacity = ''; camera.style.transform = ''; camera.style.filter = ''; lenis?.start() } })
  const fromKey = params.get('from')
  if (fromKey) {
    const i = SCENES.findIndex(s => s.key === fromKey)
    if (i >= 0) {
      history.replaceState(null, '', location.pathname)
      const go = () => { const y = yFor(i); lenis ? lenis.scrollTo(y, { immediate: true, force: true }) : scrollTo(0, y) }
      go(); requestAnimationFrame(go)
      if (!reduce) {  // arrive from the surface: start close in, pull back out to orbit
        camera.style.transition = 'none'; camera.style.transform = 'scale(.25)'; camera.style.filter = 'blur(10px)'; camera.style.opacity = '0'
        requestAnimationFrame(() => requestAnimationFrame(() => {
          camera.style.transition = 'transform 1.1s cubic-bezier(.2,.8,.2,1), filter 1.1s, opacity .6s'
          camera.style.transform = ''; camera.style.filter = ''; camera.style.opacity = ''
          setTimeout(() => camera.style.transition = '', 1200)
        }))
      }
    }
  }

  // ?moon=planetKey:index opens a moon (for previews).
  if (params.has('moon')) { const [k, mi] = params.get('moon').split(':'), sy = systems.find(o => o.pl.key === k); if (sy) setTimeout(() => land(sy.pl, sy.pl.moons[+mi || 0], sy.moons[+mi || 0].el), 600) }
  if (params.has('perf')) window.universePerformance = () => ({
    shaders: shaders.status(), suspended, framePending: !!frameId, snap: sceneSnap.state(),
    visibleScenes: sceneNodes.filter(n => n.scene.style.visibility !== 'hidden').map(n => n.scene.dataset.scene),
  })
  performance.mark('universe:ready')
  performance.measure('universe:setup', 'universe:boot', 'universe:ready')
</script>
</body>
</html>
